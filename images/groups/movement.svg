<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="Illustration of a movement track across terrain contours">
  <defs>
    <linearGradient id="mv-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7fbfb"/>
      <stop offset="1" stop-color="#e9f1f1"/>
    </linearGradient>
    <marker id="mv-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#d98f3f"/>
    </marker>
  </defs>
  <rect width="320" height="200" fill="url(#mv-bg)"/>

  <!-- contours -->
  <g fill="none" stroke="#0e6b6f" stroke-opacity=".16" stroke-width="1.3">
    <path d="M-10 44 C 60 20, 120 62, 190 40 S 290 18, 330 38"/>
    <path d="M-10 78 C 50 56, 110 96, 180 74 S 288 52, 330 72"/>
    <path d="M-10 120 C 54 100, 116 138, 186 116 S 292 96, 330 114"/>
    <path d="M-10 160 C 58 142, 118 178, 188 156 S 294 138, 330 154"/>
  </g>
  <g fill="none" stroke="#0e6b6f" stroke-opacity=".10" stroke-width="1.1">
    <path d="M-10 26 C 70 6, 130 44, 200 24 S 296 6, 330 22"/>
  </g>

  <!-- movement path -->
  <path d="M42 150 L 96 118 L 138 132 L 186 86 L 236 96 L 278 58"
        fill="none" stroke="#1f8a86" stroke-width="2.4" stroke-linecap="round"
        stroke-linejoin="round" stroke-dasharray="6 7"/>

  <!-- fixes -->
  <g>
    <circle cx="42" cy="150" r="5.5" fill="#fff" stroke="#0e6b6f" stroke-width="2.2"/>
    <circle cx="96" cy="118" r="5.5" fill="#fff" stroke="#0e6b6f" stroke-width="2.2"/>
    <circle cx="138" cy="132" r="5.5" fill="#fff" stroke="#0e6b6f" stroke-width="2.2"/>
    <circle cx="186" cy="86" r="5.5" fill="#fff" stroke="#0e6b6f" stroke-width="2.2"/>
    <circle cx="236" cy="96" r="5.5" fill="#fff" stroke="#0e6b6f" stroke-width="2.2"/>
    <circle cx="278" cy="58" r="7" fill="#d98f3f"/>
    <circle cx="278" cy="58" r="2.6" fill="#fff"/>
  </g>

  <!-- step-selection vector -->
  <path d="M236 96 L 268 66" stroke="#d98f3f" stroke-width="2" stroke-linecap="round" marker-end="url(#mv-arrow)"/>

  <!-- home range halo -->
  <ellipse cx="150" cy="112" rx="86" ry="46" fill="none" stroke="#0e6b6f" stroke-opacity=".22" stroke-width="1.4" stroke-dasharray="3 6"/>
</svg>
