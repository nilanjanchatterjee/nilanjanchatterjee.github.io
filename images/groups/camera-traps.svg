<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="Illustration of a camera trap and an animal track">
  <defs>
    <linearGradient id="ct-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7fbfb"/>
      <stop offset="1" stop-color="#e9f1f1"/>
    </linearGradient>
    <linearGradient id="ct-body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b8b86"/>
      <stop offset="1" stop-color="#0e6b6f"/>
    </linearGradient>
  </defs>
  <rect width="320" height="200" fill="url(#ct-bg)"/>

  <!-- capture frame corners -->
  <g fill="none" stroke="#0e6b6f" stroke-width="1.8" stroke-opacity=".22" stroke-linecap="round">
    <path d="M18 40 v-12 h14"/><path d="M302 40 v-12 h-14"/>
    <path d="M18 160 v12 h14"/><path d="M302 160 v12 h-14"/>
  </g>

  <!-- ground line -->
  <path d="M16 152 H304" stroke="#0e6b6f" stroke-width="1.4" stroke-opacity=".18"/>

  <!-- camera body -->
  <g>
    <rect x="46" y="76" width="96" height="66" rx="10" fill="url(#ct-body)"/>
    <rect x="58" y="64" width="30" height="14" rx="4" fill="#0e6b6f"/>
    <circle cx="94" cy="109" r="19" fill="#eaf4f4"/>
    <circle cx="94" cy="109" r="12" fill="#0e6b6f"/>
    <circle cx="88" cy="103" r="3.4" fill="#eaf4f4" opacity=".85"/>
    <circle cx="124" cy="90" r="3" fill="#f0b26b"/>
    <circle cx="124" cy="102" r="3" fill="#f0b26b" opacity=".55"/>
  </g>

  <!-- sensor arcs -->
  <g fill="none" stroke="#1f8a86" stroke-opacity=".55" stroke-linecap="round">
    <path d="M150 96 q 12 13 0 26" stroke-width="2"/>
    <path d="M162 88 q 20 21 0 42" stroke-width="1.6" stroke-opacity=".35"/>
  </g>

  <!-- paw print -->
  <g fill="#0e6b6f">
    <ellipse cx="214" cy="98" rx="8" ry="10.5" transform="rotate(-16 214 98)"/>
    <ellipse cx="234" cy="92" rx="8" ry="10.5" transform="rotate(-4 234 92)"/>
    <ellipse cx="254" cy="96" rx="7.5" ry="10" transform="rotate(10 254 96)"/>
    <ellipse cx="204" cy="80" rx="6" ry="8" transform="rotate(-26 204 80)"/>
    <path d="M203 124 q 6 -12 18 -13 q 14 -1 21 6 q 9 4 8 12 q -1 9 -13 10 q -19 2 -34 -15 z"/>
  </g>
  <g fill="#1f8a86" opacity=".28">
    <ellipse cx="214" cy="98" rx="3.2" ry="4.6" transform="rotate(-16 214 98)"/>
    <ellipse cx="234" cy="92" rx="3.2" ry="4.6"/>
    <ellipse cx="254" cy="96" rx="3.2" ry="4.6" transform="rotate(10 254 96)"/>
  </g>
</svg>
